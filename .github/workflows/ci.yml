name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Functional checks
        run: python -B -m unittest discover -s tests -v
      - name: Repository contract
        run: python -B skills/agent-foundry/scripts/foundry.py validate --root .
      - name: Skill package
        run: python -B skills/agent-foundry/scripts/foundry.py validate-skill --path skills/agent-foundry
