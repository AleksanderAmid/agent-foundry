<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d"><title id="t">The Agent Foundry workflow</title><desc id="d">Inspect the native project, specify its operational contract, build focused skills, and verify real outcomes.</desc><rect width="1200" height="280" rx="16" fill="#161d18"/><g font-family="Arial,sans-serif"><text x="35" y="42" fill="#9daf9b" font-size="12" letter-spacing="3">FROM AMBIGUITY TO AN OPERABLE WORKSPACE</text><g fill="#212c23" stroke="#40503d"><rect x="35" y="80" width="255" height="150" rx="12"/><rect x="325" y="80" width="255" height="150" rx="12"/><rect x="615" y="80" width="255" height="150" rx="12"/><rect x="905" y="80" width="260" height="150" rx="12"/></g><g fill="#c6f16b" font-size="14"><text x="58" y="112">01</text><text x="348" y="112">02</text><text x="638" y="112">03</text><text x="928" y="112">04</text><text x="301" y="160">→</text><text x="591" y="160">→</text><text x="881" y="160">→</text></g><g fill="#f1f4e9" font-size="27" font-weight="700"><text x="58" y="154">Inspect</text><text x="348" y="154">Specify</text><text x="638" y="154">Build</text><text x="928" y="154">Verify</text></g><g fill="#a6b3a3" font-size="15"><text x="58" y="187">Discover native structure.</text><text x="58" y="208">Keep the useful conventions.</text><text x="348" y="187">Make commands explicit.</text><text x="348" y="208">Define what done means.</text><text x="638" y="187">Package a real procedure.</text><text x="638" y="208">Load only relevant context.</text><text x="928" y="187">Run the actual checks.</text><text x="928" y="208">Preserve honest evidence.</text></g></g></svg>
